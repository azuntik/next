name: intentional_friction
description: A digital wellbeing app that creates self-awareness through thoughtful pauses
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State Management
  riverpod: ^2.4.9
  flutter_riverpod: ^2.4.9

  # Local Storage
  hive: ^2.2.3
  hive_flutter: ^1.1.0

  # App Usage Tracking (Android)
  app_usage: ^3.0.0

  # Permissions
  permission_handler: ^11.1.0

  # UI & Animations
  flutter_animate: ^4.3.0
  smooth_page_indicator: ^1.1.0

  # Date & Time
  intl: ^0.19.0

  # Charts & Visualization
  fl_chart: ^0.65.0

  # UUID Generation
  uuid: ^4.2.2

  # File Handling
  path_provider: ^2.1.1
  share_plus: ^7.2.1

  # URL Launching (for email, web links)
  url_launcher: ^6.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  hive_generator: ^2.0.1
  build_runner: ^2.4.7

flutter:
  uses-material-design: true
